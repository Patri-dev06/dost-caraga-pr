name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pr_frontend
    env:
      VITE_API_BASE_URL: /api/v1
      VITE_AUTH_IDLE_TIMEOUT_MINUTES: '30'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pr_frontend/package-lock.json
      - name: Install locked dependencies with the pinned npm release
        run: npx --yes npm@11.10.0 ci --no-audit --no-fund
      - name: Audit production dependencies for high-severity vulnerabilities
        run: npx --yes npm@11.10.0 audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build production client and server
        run: npm run build
      - name: Smoke-test the production server
        run: |
          PORT=4173 HOST=127.0.0.1 npm run start > /tmp/dost-caraga-pr-frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:4173/login >/dev/null

  backend:
    name: Backend tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    defaults:
      run:
        working-directory: pr_backend
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: dost_caraga_pr_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      FRONTEND_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: dost_caraga_pr_test
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-password
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, intl, curl, zip, fileinfo
          tools: composer:v2
          coverage: none
      - name: Validate Composer files
        run: composer validate --strict --no-check-publish
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Run unit and feature tests on the isolated CI database
        run: vendor/bin/phpunit --configuration phpunit.xml
